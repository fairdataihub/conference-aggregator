name: Sync conferences database

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Load JSON into Postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update main
        run: git pull --ff-only origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync conferences to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm load:conferences
