name: collect-easychair

on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  collect-easychair:
    runs-on: ubuntu-latest
    name: Collect EasyChair
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect EasyChair conferences
        run: pnpm exec tsx scripts/conference-collecting/main.ts --site easychair

      - name: Check for changes
        id: git-status
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-status.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update conference list (easychair)"
          title: "chore: update conference list (easychair)"
          body: |
            Automated conference list update (EasyChair).

            Generated at:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: update/conferences-easychair-${{ github.run_number }}
          base: test
          delete-branch: true

