name: collect-easychair

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  collect-easychair:
    runs-on: ubuntu-latest
    name: Collect EasyChair

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect EasyChair conferences
        run: pnpm exec tsx scripts/conference-collecting/main.ts --site easychair

      - name: Check for changes
        id: git-status
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-status.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add conference-postings.json
          git commit -m "chore: update conference list (EasyChair)"
          git push origin main