# GitHub Actions workflow for updating the conference list.
# Runs the conference collector and creates a PR when the list changes.
name: Update Conference List

on:
  # Run every Monday at 2 AM UTC.
  schedule:
    - cron: "0 2 * * 1"

  # Run when changes are pushed to main.
  push:
    branches:
      - test

  # Allow manual trigger.
  workflow_dispatch:

jobs:
  collect-wikicfp:
    runs-on: ubuntu-latest
    name: Collect WikiCFP

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect WikiCFP conferences
        run: pnpm exec tsx scripts/conference-collecting/main.ts --site wikicfp

      - name: Check for changes
        id: git-status
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-status.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update conference list (wikicfp)"
          title: "chore: update conference list (wikicfp)"
          body: |
            Automated conference list update (WikiCFP).

            Generated at:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: update/conferences-wikicfp-${{ github.run_number }}
          base: main
          delete-branch: true

  collect-easychair:
    runs-on: ubuntu-latest
    name: Collect EasyChair

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect EasyChair conferences
        run: pnpm exec tsx scripts/conference-collecting/main.ts --site easychair

      - name: Check for changes
        id: git-status
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-status.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update conference list (easychair)"
          title: "chore: update conference list (easychair)"
          body: |
            Automated conference list update (EasyChair).

            Generated at:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: update/conferences-easychair-${{ github.run_number }}
          base: main
          delete-branch: true
