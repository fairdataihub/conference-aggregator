# GitHub Actions workflow for updating the conference list.
# Runs the conference collector and creates a PR when the list changes.
name: Update Conference List

on:
  # Run every Monday at 2 AM UTC.
  schedule:
    - cron: "0 2 * * 1"

  # Run when changes are pushed to main.
  push:
    branches:
      - main

  # Allow manual trigger.
  workflow_dispatch:

jobs:
  collect-conferences:
    runs-on: ubuntu-latest
    name: Collect Conferences

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsx scripts/conference-collecting/main.ts

      - name: Check for changes
        id: git-status
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-status.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update conference list"
          title: "chore: update conference list"
          body: |
            Automated conference list update.

            Generated at:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: update/conferences-${{ github.run_number }}
          base: main
          delete-branch: true
