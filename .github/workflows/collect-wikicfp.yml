name: Collect WikiCFP

on:
  push:
    branches:
      - test
    paths-ignore:
      - conference-postings.json
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-wikicfp:
    runs-on: ubuntu-latest
    name: Collect WikiCFP

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect WikiCFP
        run: pnpm collect:wikicfp

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "Attempt $i"

            git fetch origin test

            echo "Resetting to latest test branch..."
            git reset --hard origin/test

            echo "Collecting WikiCFP against latest data..."
            pnpm collect:wikicfp

            git add conference-postings.json

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: update WikiCFP conference data"

            if git push origin test; then
              echo "Successfully pushed changes."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Failed to push after 5 attempts."
          exit 1