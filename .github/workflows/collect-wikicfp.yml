name: Collect WikiCFP

on:
  push:
    branches:
      - test
    paths-ignore:
      - conference-postings.json
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conference-data-test
  cancel-in-progress: false

jobs:
  collect-wikicfp:
    runs-on: ubuntu-latest
    name: Collect WikiCFP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect WikiCFP
        run: pnpm collect:wikicfp

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add conference-postings.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update WikiCFP conference data"
          git push