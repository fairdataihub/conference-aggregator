name: Collect WikiData

on:
  push:
    branches:
      - staging
    paths-ignore:
      - conference-postings.json
      - conference-postings-full.json
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: conference-aggregator-collectors
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  collect-wikidata:
    runs-on: ubuntu-latest
    name: Collect WikiData

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Update staging
        run: |
          git pull --ff-only origin staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect WikiData
        run: pnpm collect:wikidata.org

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add conference-postings.json conference-postings-full.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update Wikidata conference data"
          git push origin staging
