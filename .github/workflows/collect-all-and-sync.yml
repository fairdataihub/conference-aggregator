name: Collect all conferences and sync database

on:
  schedule:
    - cron: "30 22 * * 0"
  workflow_dispatch:

concurrency:
  group: collect-all-and-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-callforpaper-org:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: Collect callforpaper.org
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect:callforpaper.org
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conference-postings.json conference-postings-full.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: update CallForPaper.org conference data"
          git push origin "HEAD:${{ github.ref_name }}"

  collect-call4paper:
    needs: collect-callforpaper-org
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: Collect call4paper.com
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect:call4paper.com
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conference-postings.json conference-postings-full.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: update Call4Paper conference data"
          git push origin "HEAD:${{ github.ref_name }}"

  collect-wikidata:
    needs: collect-call4paper
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: Collect wikidata.org
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect:wikidata.org
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conference-postings.json conference-postings-full.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: update Wikidata conference data"
          git push origin "HEAD:${{ github.ref_name }}"

  collect-wikicfp:
    needs: collect-wikidata
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: Collect wiki.cfp
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect:wiki.cfp
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conference-postings.json conference-postings-full.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: update WikiCFP conference data"
          git push origin "HEAD:${{ github.ref_name }}"

  collect-confident-conference:
    needs: collect-wikicfp
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: Collect confident-conference.org
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect:confident-conference.org
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conference-postings.json conference-postings-full.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: update ConfIDent conference data"
          git push origin "HEAD:${{ github.ref_name }}"

  sync-database:
    needs: collect-confident-conference
    uses: ./.github/workflows/sync-conferences-db.yml
    secrets: inherit
